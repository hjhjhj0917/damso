spring.application.name=damso

server.port=${PORT:11000}

# ---- Database ----
# 자격증명에는 기본값을 두지 않는다. 기본 비밀번호는 결국 운영에 도달하는 비밀번호다.
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mariadb://192.168.89.129:3306/Damso}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---- MyBatis ----
# map-underscore-to-camel-case: USER_NAME 컬럼 -> userName 필드 자동 매핑
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=hanium.damso.dto

# ---- Mail ----
# 쓰는 곳은 비밀번호 재설정 인증번호 하나. 비어 있으면 메일이 안 나가고 그 기능만 멈춘다.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:465}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_HOST:smtp.gmail.com}

# ---- Session cookie ----
# same-site=lax 유지. strict로 조이면 나중에 소셜 로그인 콜백이 세션 쿠키를 못 싣는다.
# secure는 운영에서 반드시 true. 단 http 개발 환경에서 true면 로그인이 통째로 안 된다.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# ---- CORS ----
# 세션 쿠키를 쓰므로 "*" 불가. Vite 개발 서버가 기본값.
damso.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ---- 비밀번호 해시 pepper ----
# 모든 비밀번호 해시에 들어간다. 값이 바뀌면 기존 계정이 전부 로그인 불가.
# 한 번 정하면 절대 바꾸지 말 것.
damso.encrypt.salt=${SALT}

# ---- LLM (OpenAI Compatible) ----
damso.llm.url=${LLM_URL:}
damso.llm.model=${LLM_MODEL:}
damso.llm.key=${OPENAI_API_KEY:}

damso.llm.prompt=${LLM_PROMPT:}
damso.llm.diary.prompt=${LLM_DIARY_PROMPT:}
damso.llm.autobiography.prompt=${LLM_AUTOBIOGRAPHY_PROMPT:}

damso.llm.diary.format=${LLM_DIARY_FORMAT:json}
damso.llm.autobiography.format=${LLM_AUTOBIOGRAPHY_FORMAT:json}

# ---- Logging ----
# mapper 로거를 따로 두는 이유: DEBUG로 켜면 SQL과 함께 PASSWORD, PASSWORD_SALT가 로그에 찍힌다.
logging.level.root=${LOG_LEVEL:INFO}
logging.level.hanium.damso=${APP_LOG_LEVEL:INFO}
logging.level.hanium.damso.mapper=${SQL_LOG_LEVEL:INFO}
